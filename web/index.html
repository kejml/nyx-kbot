<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiky bodů</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Statistiky bodů</h1>
    <div id="status">Načítám data...</div>
    <div id="filter-bar"></div>
    <div id="aggregation-bar">
        <span class="agg-label">Agregace:</span>
        <button class="agg-btn" data-agg="1d">1D</button>
        <button class="agg-btn" data-agg="3d">3D</button>
        <button class="agg-btn" data-agg="1w">1T</button>
        <button class="agg-btn" data-agg="2w">2T</button>
        <button class="agg-btn" data-agg="1m">1M</button>
        <button class="agg-btn active" data-agg="auto">Auto</button>
    </div>
    <div class="charts">
        <div id="chart-timeseries" class="chart chart-full" style="height:400px"></div>
        <div id="chart-dayofweek" class="chart" style="height:350px"></div>
        <div id="chart-hourly" class="chart" style="height:350px"></div>
        <div id="chart-top-receivers" class="chart"></div>
        <div id="chart-top-givers" class="chart"></div>
    </div>
    <div id="stats-section">
        <table id="stats-table">
            <thead><tr><th>Metrika</th><th>Hodnota</th><th>Datum</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</body>
</html>
